<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#45190e">
<meta name="description" content="ภารกิจส่งงานวิจัย — ตอบทีละคำถาม เลือกรูปแบบงานวิจัย แนบบทที่พร้อมส่ง แล้ววาร์ปไปที่ Dashboard">
<title>ส่งงานวิจัย · Research Uplink</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%23fffdf9' stroke='%23b08d57' stroke-width='2'/%3E%3Cpath d='M18 33V15h7a5 5 0 0 1 0 10h-7m7 0 6 8' fill='none' stroke='%238a6a3a' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@200;300;400;500&family=Noto+Sans+Thai:wght@300;400;500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#fbf8f2;
  --paper:#fffdf9;
  --ink:#3a3128;
  --text:#3a3128;
  --text-2:#6b5f52;
  --muted:#9a8c7c;
  --gold:#b08d57;
  --gold-2:#d8bf8f;
  --gold-dark:#8a6a3a;
  --champagne:#fbf4e6;
  --line:rgba(176,141,87,.32);
  --line-2:rgba(176,141,87,.6);
  --ok:#5f8a5a;
  --err:#b0554f;
  --grad:linear-gradient(120deg,#8a6a3a 0%,#c9a56b 45%,#8a6a3a 100%);
  --display:'Taviraj','Noto Serif Thai',Georgia,serif;
  --body:'Noto Sans Thai','Taviraj',system-ui,sans-serif;
  --script:'Great Vibes',cursive;
  --latin:'Cormorant Garamond','Taviraj',Georgia,serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow-x:hidden;color:var(--text);font-family:var(--body);font-size:16px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
  background:radial-gradient(48% 40% at 0% 0%,rgba(243,223,216,.75),transparent 70%),radial-gradient(50% 42% at 100% 100%,rgba(233,215,180,.6),transparent 70%),
    radial-gradient(rgba(140,107,58,.05) 1px,transparent 1.3px) 0 0/7px 7px,var(--ivory);background-attachment:fixed}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1.5px solid var(--gold);outline-offset:4px}
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ── ลายประดับ & กลีบดอกไม้ ── */
#sky{position:fixed;inset:0;z-index:1;pointer-events:none}
.flora{position:fixed;z-index:0;width:min(300px,38vw);height:auto;pointer-events:none;opacity:.55}
.flora.tl{left:-10px;top:-10px}
.flora.br{right:-10px;bottom:-10px;transform:rotate(180deg)}

/* ── แถบบน ── */
.top{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px clamp(16px,4vw,40px) 0}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;font:400 18px var(--display)}
.brand svg{width:40px;height:40px;flex:none}
.top-r{display:flex;align-items:center;gap:10px}
.glass-pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border:1px solid var(--line-2);border-radius:999px;background:rgba(255,253,249,.7);
  color:var(--ink);text-decoration:none;font:400 14px var(--display);white-space:nowrap;transition:background .2s,border-color .2s}
a.glass-pill:hover{background:var(--champagne);border-color:var(--gold)}
.glass-pill svg{width:17px;height:17px;color:var(--gold-dark)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.status[data-s="ok"] .dot{background:var(--ok)}
.status[data-s="warn"] .dot{background:var(--gold)}
.status[data-s="err"] .dot{background:var(--err)}
.status{font-size:13px;color:var(--text-2)}

/* ── เส้นความคืบหน้า + แหวนคู่ ── */
.traj{position:relative;z-index:4;height:34px;margin:22px clamp(28px,8vw,120px) 0}
.traj-line{position:absolute;left:0;right:0;top:16px;height:1px;background:var(--line)}
.traj-line i{position:absolute;left:0;top:-.5px;height:2px;width:0;background:linear-gradient(90deg,var(--gold-2),var(--gold));transition:width .9s var(--ease)}
.traj-dots{position:absolute;inset:0}
.traj-dots span{position:absolute;top:12.5px;width:8px;height:8px;margin-left:-4px;transform:rotate(45deg);border:1px solid var(--line-2);background:var(--ivory);transition:background .4s,border-color .4s}
.traj-dots span.on{border-color:var(--gold);background:var(--gold-2)}
.rocket{position:absolute;top:-1px;left:0;width:36px;height:34px;margin-left:-18px;transition:left .9s var(--ease)}

/* ── การ์ดเชิญ ── */
.stage{position:relative;z-index:3;flex:1;display:grid;place-items:center;padding:34px clamp(14px,4vw,40px) 70px}
.q{position:relative;width:min(820px,100%);padding:clamp(34px,5vw,62px) clamp(22px,5.5vw,70px) clamp(30px,4.5vw,52px);text-align:center;background:var(--paper);
  border:1px solid var(--line);box-shadow:0 0 0 7px var(--paper),0 0 0 8px var(--line),0 40px 80px -50px rgba(90,70,40,.45)}
.q::before,.q::after{content:"";position:absolute;width:86px;height:86px;pointer-events:none;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2090%2090'%20fill%3D'none'%20stroke%3D'%23b08d57'%20stroke-width%3D'1'%3E%3Cpath%20d%3D'M4%2070V22C4%2012%2012%204%2022%204h48'%2F%3E%3Cpath%20d%3D'M12%2070V26c0-8%206-14%2014-14h44'%20stroke-width%3D'.6'%2F%3E%3Cpath%20d%3D'M22%2020c8%202%2012%208%2010%2016-6-2-10-8-10-16zM20%2022c-2%208%202%2014%2010%2016%200-8-4-14-10-16z'%20stroke-width%3D'.8'%2F%3E%3Ccircle%20cx%3D'70'%20cy%3D'4'%20r%3D'1.6'%20fill%3D'%23b08d57'%2F%3E%3Ccircle%20cx%3D'4'%20cy%3D'70'%20r%3D'1.6'%20fill%3D'%23b08d57'%2F%3E%3C%2Fsvg%3E") center/contain no-repeat}
.q::before{left:12px;top:12px}
.q::after{right:12px;bottom:12px;transform:rotate(180deg)}
.q.enter{animation:qIn .7s var(--ease)}
.q.enter.back{animation-name:qBack}
@keyframes qIn{from{opacity:0;transform:translateY(16px)}}
@keyframes qBack{from{opacity:0;transform:translateY(-12px)}}
.script{font:400 clamp(30px,3.8vw,42px)/1.1 var(--script);color:var(--gold);margin-bottom:8px}
.label{display:inline-flex;align-items:center;gap:14px;font:400 14.5px var(--display);color:var(--gold-dark)}
.label::before,.label::after{content:"";width:40px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.label::after{transform:scaleX(-1)}
.q-title{margin:14px 0 0;font:300 clamp(30px,4.6vw,52px)/1.32 var(--display);color:var(--ink);overflow-wrap:anywhere}
.q-title b{font-weight:500;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.q-desc{margin:12px auto 0;max-width:52ch;font-size:16px;color:var(--text-2);overflow-wrap:anywhere}
.body{margin-top:24px;text-align:left}
.body::before{content:"";display:block;width:200px;height:12px;margin:0 auto 28px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20200%2012'%3E%3Cpath%20d%3D'M0%206h86M114%206h86'%20stroke%3D'%23b08d57'%20stroke-width%3D'.8'%2F%3E%3Cpath%20d%3D'M100%201l5%205-5%205-5-5z'%20fill%3D'none'%20stroke%3D'%23b08d57'%20stroke-width%3D'.9'%2F%3E%3Ccircle%20cx%3D'88'%20cy%3D'6'%20r%3D'1.3'%20fill%3D'%23b08d57'%2F%3E%3Ccircle%20cx%3D'112'%20cy%3D'6'%20r%3D'1.3'%20fill%3D'%23b08d57'%2F%3E%3C%2Fsvg%3E") center/contain no-repeat}
.busy .body{opacity:.5;pointer-events:none}

/* ช่องกรอก (เส้นใต้แบบการ์ดเชิญ) */
.in{display:block;width:100%;min-height:58px;padding:10px 8px;border:0;border-bottom:1px solid var(--line-2);border-radius:0;background:transparent;outline:none;text-align:center;
  font:400 clamp(20px,2.4vw,26px)/1.5 var(--display);color:var(--ink);transition:border-color .25s,box-shadow .25s}
.in::placeholder{color:#c1b39f}
.in:hover{border-bottom-color:var(--gold)}
.in:focus{border-bottom-color:var(--gold);box-shadow:0 1px 0 0 var(--gold)}
textarea.in{resize:none;overflow:hidden}
.in.code{font-family:var(--latin);font-weight:600;font-variant-numeric:lining-nums;letter-spacing:.12em;text-transform:uppercase}
.in.bad{border-bottom-color:var(--err);box-shadow:0 1px 0 0 var(--err)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.row2 label{display:block;font:400 14px var(--display);color:var(--text-2);text-align:center}
.hint{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;margin:12px 4px 0;font-size:13.5px;color:var(--muted);text-align:center}
.err{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 4px 0;font-size:14.5px;color:var(--err);animation:qIn .3s var(--ease)}
.err:empty{display:none}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.body>.link{display:block;margin:18px auto 0}
.link{padding:0;border:0;background:none;color:var(--gold-dark);font:400 15px var(--display);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:5px}
.link:hover{color:var(--ink)}

/* ปุ่ม */
.acts{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:34px}
.btn-go{display:inline-flex;align-items:center;gap:12px;height:52px;padding:0 34px;border:1px solid var(--gold);border-radius:999px;background:var(--ink);color:#f6ead2;
  font:400 17px var(--display);letter-spacing:.02em;box-shadow:0 0 0 4px var(--paper),0 0 0 5px rgba(176,141,87,.45),0 14px 30px -16px rgba(58,49,40,.6);transition:background .2s,box-shadow .25s,transform .15s}
.btn-go:hover{background:#2a231c;box-shadow:0 0 0 4px var(--paper),0 0 0 5px var(--gold),0 18px 34px -16px rgba(58,49,40,.7)}
.btn-go:active{transform:translateY(1px)}
.btn-go:disabled{background:#d9d1c4;border-color:#d9d1c4;color:#fff;box-shadow:none;cursor:not-allowed}
.btn-go .arr{transition:transform .25s var(--ease)}
.btn-go:hover .arr{transform:translateX(4px)}
.btn-back{height:52px;padding:0 18px;border:0;border-radius:999px;background:none;color:var(--text-2);font:400 15.5px var(--display)}
.btn-back:hover{color:var(--ink);background:var(--champagne)}
.kbd{width:100%;text-align:center;font-size:12.5px;color:var(--muted)}
.kbd kbd{display:inline-block;padding:0 8px;margin:0 2px;border:1px solid var(--line);border-radius:4px;font:500 12px var(--latin);color:var(--text-2)}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 20px;border:1px solid var(--line-2);border-radius:999px;background:transparent;color:var(--gold-dark);
  font:400 14.5px var(--display);text-decoration:none;transition:background .2s,border-color .2s}
.btn-ghost:hover{background:var(--champagne);border-color:var(--gold)}

/* แผงด้านใน */
.glass{border:1px solid var(--line);border-radius:6px;background:#fff}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.choice{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 22px 26px;text-align:center;border:1px solid var(--line);border-radius:6px;background:#fff;
  transition:border-color .25s,box-shadow .25s,transform .25s var(--ease)}
.choice:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 18px 36px -26px rgba(90,70,40,.6)}
.choice .ico{width:58px;height:58px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:50%;color:var(--gold-dark);background:var(--champagne)}
.choice .ico svg{width:26px;height:26px}
.choice b{font:500 20px/1.4 var(--display)}
.choice small{font-size:14px;color:var(--text-2)}
.choice .go{display:none}
.sub{margin:30px 0 12px;font:400 14.5px var(--display);color:var(--text-2);text-align:center}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.chip-btn{display:flex;flex-direction:column;align-items:center;max-width:330px;padding:10px 18px;border:1px solid var(--line);border-radius:6px;background:#fff;text-align:center;transition:border-color .2s}
.chip-btn:hover{border-color:var(--gold)}
.chip-btn b{font:600 14px var(--latin);font-variant-numeric:lining-nums;letter-spacing:.08em;color:var(--gold-dark)}
.chip-btn span{max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13.5px;color:var(--text-2)}

/* รูปแบบงานวิจัย */
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opt{position:relative;display:block;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .card{display:flex;align-items:center;gap:12px;min-height:74px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:#fff;transition:border-color .2s,background .2s,box-shadow .25s}
.opt:hover .card{border-color:var(--gold)}
.orb{flex:none;width:11px;height:11px;transform:rotate(45deg);border:1px solid var(--gold);background:linear-gradient(135deg,#f6ead2,#c9a56b)}
.opt .t{min-width:0}
.opt b{display:block;font:400 15.5px/1.35 var(--display)}
.opt small{display:block;font:500 13px var(--latin);font-style:italic;color:var(--muted)}
.opt input:checked+.card{border-color:var(--gold);background:var(--champagne);box-shadow:inset 0 0 0 1px var(--gold)}
.opt input:checked+.card::after{content:"✓";margin-left:auto;color:var(--gold-dark);font-weight:600}
.opt input:focus-visible+.card{outline:1.5px solid var(--gold);outline-offset:3px}
.other{margin-top:16px}

/* ไฟล์ */
.files{list-style:none;margin:0;padding:4px 16px;border:1px solid var(--line);border-radius:6px;background:#fff}
.frow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 2px;transition:background .2s}
.frow+.frow{border-top:1px solid rgba(176,141,87,.2)}
.frow.drag{background:var(--champagne)}
.frow .orb{opacity:.35;background:transparent}
.frow.new .orb,.frow.sent .orb{opacity:1;background:linear-gradient(135deg,#f6ead2,#c9a56b)}
.f-main{min-width:0}
.f-main b{font:500 16px var(--display)}
.f-main small{margin-left:8px;font-size:13px;color:var(--muted)}
.f-file{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px;color:var(--muted)}
.frow.sent .f-file{color:var(--ok)}
.frow.new .f-file{color:var(--gold-dark)}
.f-act{display:flex;align-items:center;gap:6px}
.pick{height:36px;padding:0 16px;border:1px solid var(--line-2);border-radius:999px;background:transparent;color:var(--gold-dark);font:400 14px var(--display);white-space:nowrap;transition:background .2s,border-color .2s}
.pick:hover{border-color:var(--gold);background:var(--champagne)}
.frow.new .pick{background:var(--champagne)}
.del{width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--muted)}
.del:hover{background:rgba(176,85,79,.1);color:var(--err)}
.del svg{width:16px;height:16px}
body.dropping .files{border-color:var(--gold);box-shadow:0 0 0 4px var(--champagne)}

/* ตรวจทาน / ส่งเสร็จ */
.sum{padding:6px 24px}
.sum div{display:grid;grid-template-columns:136px minmax(0,1fr);gap:14px;padding:12px 0}
.sum div+div{border-top:1px solid rgba(176,141,87,.2)}
.sum dt{font:400 14.5px var(--display);color:var(--gold-dark)}
.sum dd{margin:0;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:8px;padding:3px 12px;border:1px solid var(--line-2);border-radius:999px;background:var(--champagne);font:400 14px var(--display)}
.tag .orb{width:8px;height:8px}
.tag em{font-style:italic;font:600 13px var(--latin);color:var(--gold-dark)}
.check{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:22px;font:400 15.5px var(--display);cursor:pointer;text-align:left}
.check input{flex:none;width:20px;height:20px;margin:0;accent-color:#8a6a3a}
.seal{position:relative;width:86px;height:86px;margin:0 auto 22px;display:grid;place-items:center;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#c65b50 0%,#9a3b33 55%,#7c2b25 100%);box-shadow:0 0 0 3px rgba(154,59,51,.35),0 10px 20px -8px rgba(110,30,25,.7);
  animation:seal .7s cubic-bezier(.2,1.4,.4,1) .2s both}
.seal::before{content:"";position:absolute;inset:9px;border-radius:50%;border:1px solid rgba(255,220,205,.55)}
.seal span{font:400 42px/1 var(--script);color:#f6d9cf;transform:translateY(3px)}
@keyframes seal{from{opacity:0;transform:scale(1.8) rotate(-24deg)}}
.codebox{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 22px;text-align:center}
.codebox small{display:block;font:400 13.5px var(--display);color:var(--muted)}
.codebox b{display:block;font:600 clamp(24px,3.6vw,36px) var(--latin);font-variant-numeric:lining-nums;letter-spacing:.14em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;word-break:break-all}
.progress-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
.progress-chips>span{display:inline-flex;align-items:center;gap:8px;padding:3px 12px;border:1px solid var(--line);border-radius:999px;font:400 13.5px var(--display);color:var(--muted)}
.progress-chips>span .orb{width:7px;height:7px;opacity:.35;background:transparent}
.progress-chips>span.on{color:var(--ink);border-color:var(--line-2)}
.progress-chips>span.on .orb{opacity:1;background:linear-gradient(135deg,#f6ead2,#c9a56b)}
.progress-chips>span.now{color:var(--ink);border-color:var(--gold);background:var(--champagne)}
.progress-chips>span.now .orb{opacity:1;background:linear-gradient(135deg,#f6ead2,#c9a56b)}
.signal{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:22px;padding:18px 22px;text-align:center;border-left:0;border-right:0;border-radius:0;background:transparent}
.signal svg{flex:none;width:26px;height:26px;color:var(--gold)}
.signal small{display:block;font:400 22px/1 var(--script);color:var(--gold)}
.signal p{margin:4px 0 0;font:400 18px/1.5 var(--display);color:var(--ink)}
.signal button{margin-top:6px}
.redir{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:20px;color:var(--text-2);font:400 15px var(--display)}
.redir svg{width:30px;height:30px;transform:rotate(-90deg)}
.redir circle{fill:none;stroke-width:2}
.redir .rt{stroke:var(--line)}
.redir .rb{stroke:var(--gold);stroke-dasharray:100;stroke-dashoffset:0;stroke-linecap:round}
.more{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
.note{margin-top:18px;padding:14px 18px;border:1px solid var(--line-2);border-radius:6px;background:var(--champagne);font-size:15px;text-align:center}
.note b{display:block;font:400 14px var(--display);color:var(--gold-dark)}
.pinfo{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 20px;margin-top:14px;font-size:14.5px;color:var(--text-2);text-align:center}

/* กำลังส่ง */
.launch{display:flex;flex-direction:column;align-items:center;gap:6px}
.launch svg{width:120px;height:90px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.flap{transform-origin:60px 14px;animation:flap 2.4s ease-in-out infinite}
@keyframes flap{50%{transform:scaleY(.82)}}
.pct{font:300 clamp(56px,8vw,88px)/1 var(--latin);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.plist{list-style:none;margin:22px 0 0;padding:16px 22px;display:grid;gap:14px}
.pl-top{display:flex;justify-content:space-between;gap:12px;font:400 15px var(--display)}
.pl-top span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pl-top small{margin-left:8px;font-size:13px;color:var(--muted)}
.pl-st{flex:none;font-size:13px;color:var(--muted)}
.bar{height:2px;margin-top:8px;overflow:hidden;background:var(--line)}
.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--gold-2),var(--gold))}
.plist li.done .pl-st{color:var(--ok)}
.plist li.done .bar i{background:var(--ok)}
.plist li.error .pl-st{color:var(--err)}
.pl-note{margin:14px 0 0;color:var(--text-2);text-align:center;font-family:var(--display)}

/* footer + snackbar */
.foot{position:relative;z-index:3;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:0 clamp(16px,4vw,40px) 18px;font-size:13px;color:var(--muted)}
.snackbar{position:fixed;left:50%;bottom:26px;z-index:40;max-width:min(560px,calc(100vw - 32px));padding:12px 22px;border:1px solid var(--line-2);border-radius:999px;background:var(--paper);
  box-shadow:0 20px 50px -24px rgba(90,70,40,.6);font:400 14.5px var(--display);opacity:0;transform:translate(-50%,12px);transition:opacity .2s,transform .3s var(--ease);pointer-events:none}
.snackbar.show{opacity:1;transform:translate(-50%,0)}
.flash{position:fixed;inset:0;z-index:60;pointer-events:none;background:var(--ivory);opacity:0}
body.warping .flash{animation:flash .9s ease-in forwards}
@keyframes flash{to{opacity:1}}

@media (max-width:860px){
  .choices{grid-template-columns:1fr}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  .brand span{display:none}
  .status b{display:none}
  .traj{margin:18px 26px 0}
  .stage{padding:22px 12px 50px}
  .q{box-shadow:0 0 0 5px var(--paper),0 0 0 6px var(--line),0 30px 60px -40px rgba(90,70,40,.45)}
  .q::before,.q::after{width:58px;height:58px;left:8px;top:8px}
  .q::after{left:auto;top:auto;right:8px;bottom:8px}
  .row2{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .sum{padding:6px 16px}
  .sum div{grid-template-columns:1fr;gap:2px}
  .frow{grid-template-columns:16px minmax(0,1fr);row-gap:8px}
  .f-act{grid-column:2}
  .kbd{display:none}
  .btn-go{flex:1;justify-content:center}
  .flora{opacity:.35}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ════════ MODERN LUXE · กระจกสีเอสเปรสโซ + ทองแชมเปญ ════════ */
@property --gx{syntax:'<percentage>';inherits:true;initial-value:50%}
@property --gy{syntax:'<percentage>';inherits:true;initial-value:0%}
:root{
  --ink:#fff1e8;--text:#fbe9df;--text-2:#ecccba;--muted:#c9a18c;
  --gold:#f0a57a;--gold-2:#ffd2b3;--gold-dark:#f7b892;--champagne:rgba(240,150,105,.1);
  --line:rgba(255,214,190,.13);--line-2:rgba(255,214,190,.26);
  --paper:#2e120a;--ivory:#1c0a06;--ok:#a8d8a0;--err:#ffb0c0;
  --gold-text:linear-gradient(100deg,#e0845c 0%,#ffe0cc 28%,#f0a57a 48%,#fff0e6 68%,#c8603a 100%);
  --grad:var(--gold-text);
  --display:'Prompt','Noto Sans Thai',system-ui,sans-serif;
  --body:'Noto Sans Thai','Prompt',system-ui,sans-serif;
  --script:'Jost','Prompt',sans-serif;--latin:'Jost','Prompt',sans-serif;--mono:'Jost','Prompt',sans-serif;
  color-scheme:dark;
}
body{color:var(--text);font-family:var(--body);background:radial-gradient(100% 70% at 50% -10%,#7d3420 0%,#45190e 45%,#200b06 100%);background-attachment:fixed}
body::before{content:none}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 50%,transparent 50%,rgba(0,0,0,.6))}
::selection{background:rgba(240,150,105,.35);color:#fff}

/* ฉากหลัง: แสงอุ่นเคลื่อนช้า + วงโคจรทอง + เกรนฟิล์ม */
.aura{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%}
.b1{width:75vmax;height:75vmax;left:-22vmax;top:-30vmax;background:radial-gradient(closest-side,rgba(222,98,56,.46),transparent);animation:b1 24s ease-in-out infinite alternate}
.b2{width:65vmax;height:65vmax;right:-24vmax;bottom:-30vmax;background:radial-gradient(closest-side,rgba(246,150,102,.30),transparent);animation:b2 28s ease-in-out infinite alternate}
.b3{width:50vmax;height:50vmax;left:30%;top:22%;background:radial-gradient(closest-side,rgba(140,36,18,.52),transparent);animation:b3 32s ease-in-out infinite alternate}
@keyframes b1{to{transform:translate(18vmax,14vmax) scale(1.1)}}
@keyframes b2{to{transform:translate(-16vmax,-12vmax) scale(1.15)}}
@keyframes b3{to{transform:translate(-14vmax,10vmax) scale(.9)}}
.orbits{position:absolute;left:50%;top:54%;width:min(1250px,165vw);height:auto;transform:translate(-50%,-50%);opacity:.75}
.orbits .o{transform-origin:500px 500px;animation:spin 60s linear infinite}
.orbits .o2{animation-duration:95s;animation-direction:reverse}
.orbits .o3{animation-duration:150s}
@keyframes spin{to{transform:rotate(360deg)}}
.grain{position:absolute;inset:0;opacity:.055;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'200'%20height%3D'200'%3E%3Cfilter%20id%3D'n'%3E%3CfeTurbulence%20type%3D'fractalNoise'%20baseFrequency%3D'.85'%20numOctaves%3D'3'%20stitchTiles%3D'stitch'%2F%3E%3CfeColorMatrix%20values%3D'0%200%200%200%201%20%200%200%200%200%20.9%20%200%200%200%200%20.75%20%200%200%200%20.6%200'%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D'100%25'%20height%3D'100%25'%20filter%3D'url(%23n)'%2F%3E%3C%2Fsvg%3E") 0 0/200px 200px}

/* แถบบน */
.top,.traj,.foot{transition:opacity .8s .35s}
.brand{color:var(--ink);font:400 16px var(--display)}
.brand svg{width:38px;height:38px}
.glass-pill{height:40px;border-color:var(--line);background:rgba(255,232,220,.04);color:var(--ink);font:400 13.5px var(--body);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
a.glass-pill:hover{background:rgba(240,150,105,.12);border-color:rgba(240,150,105,.55)}
.glass-pill svg{color:var(--gold-2)}
.status{color:var(--text-2)}
.status[data-s="ok"] .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.status[data-s="warn"] .dot{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.status[data-s="err"] .dot{background:var(--err);box-shadow:0 0 8px var(--err)}
.traj-line{background:rgba(255,214,190,.12)}
.traj-line i{height:2px;top:-.5px;background:linear-gradient(90deg,#b9502f,#ffd2b3);box-shadow:0 0 12px rgba(240,150,105,.7)}
.traj-dots span{top:13px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;transform:none;background:#2a0f08;border:1px solid rgba(255,214,190,.3)}
.traj-dots span.on{background:#ffd2b3;border-color:#ffd2b3;box-shadow:0 0 10px rgba(255,214,190,.8)}
.rocket{filter:drop-shadow(0 0 8px rgba(255,214,190,.8))}
.foot{color:var(--muted)}

/* การ์ดกระจก */
.q{width:min(860px,100%);border:0;border-radius:30px;isolation:isolate;
  padding:clamp(38px,5vw,58px) clamp(22px,5.5vw,64px) clamp(32px,4.5vw,50px);
  background:radial-gradient(720px circle at var(--gx) var(--gy),rgba(255,214,190,.075),transparent 45%),linear-gradient(180deg,rgba(104,40,24,.60),rgba(40,14,8,.80));
  -webkit-backdrop-filter:blur(20px) saturate(1.25);backdrop-filter:blur(20px) saturate(1.25);
  box-shadow:0 50px 120px -40px rgba(0,0,0,.95),0 0 0 1px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,228,214,.10)}
.q::before,.q::after{content:"";position:absolute;inset:0;left:0;top:0;right:0;bottom:0;width:auto;height:auto;transform:none;border-radius:inherit;padding:1px;pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.q::before{background:linear-gradient(150deg,rgba(255,222,200,.72),rgba(240,150,105,.14) 30%,rgba(240,150,105,.05) 60%,rgba(240,150,105,.5))}
.q::after{padding:1.5px;background:radial-gradient(240px circle at var(--gx) var(--gy),rgba(255,236,224,.95),transparent 70%)}
.q>*{position:relative;z-index:1}
.q.drift{animation:drift 10s ease-in-out infinite alternate}
@keyframes drift{0%{--gx:12%;--gy:0%}100%{--gx:88%;--gy:30%}}
@keyframes qIn{from{opacity:0;transform:translateY(22px) scale(.985)}}
@keyframes qBack{from{opacity:0;transform:translateY(-16px) scale(.985)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.q.enter{animation:qIn .8s var(--ease)}
.q.enter.back{animation-name:qBack}
.q.drift.enter{animation:qIn .8s var(--ease),drift 10s ease-in-out infinite alternate}
.q.drift.enter.back{animation:qBack .8s var(--ease),drift 10s ease-in-out infinite alternate}
.q.enter .q-title{animation:rise .8s .06s var(--ease) both}
.q.enter .q-desc{animation:rise .8s .12s var(--ease) both}
.q.enter .body{animation:rise .8s .18s var(--ease) both}
.q.enter .acts{animation:rise .8s .24s var(--ease) both}
.script{margin:0 0 18px;font:400 11.5px/1 var(--latin);letter-spacing:.46em;padding-left:.46em;text-transform:uppercase;
  background:var(--gold-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.label{gap:10px;padding:5px 15px;border:1px solid var(--line);border-radius:999px;background:rgba(255,232,220,.035);font:400 13.5px var(--body);color:var(--gold-2)}
.label::before{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.label::after{display:none}
.q-title{margin-top:18px;font:300 clamp(30px,4.4vw,52px)/1.3 var(--display);color:var(--ink);letter-spacing:-.005em}
.q-title b{font-weight:400;background:var(--gold-text);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s ease-in-out infinite alternate}
@keyframes shine{to{background-position:100% 0}}
.q-desc{color:var(--text-2);font-size:16px}
.body::before{width:56px;height:1px;margin:0 auto 28px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

/* ช่องกรอก */
.in{min-height:62px;padding:14px 22px;border:1px solid var(--line);border-radius:18px;background:rgba(255,232,220,.035);
  font:300 clamp(19px,2.3vw,24px)/1.5 var(--display);color:var(--ink);caret-color:var(--gold-2);box-shadow:inset 0 1px 0 rgba(255,232,220,.04);transition:border-color .25s,box-shadow .25s,background .25s}
.in::placeholder{color:rgba(255,214,190,.32)}
.in:hover{border-color:var(--line-2)}
.in:focus{border-color:rgba(240,150,105,.75);background:rgba(255,232,220,.055);box-shadow:0 0 0 4px rgba(240,150,105,.13),0 12px 30px -16px rgba(240,150,105,.35)}
.in.bad{border-color:var(--err);box-shadow:0 0 0 4px rgba(255,176,192,.12)}
.in.code{font-family:var(--latin);font-weight:400;letter-spacing:.16em}
.row2 label{margin-bottom:6px;font:400 14px var(--body);color:var(--text-2)}
.hint{color:var(--muted)}
.err{color:var(--err)}
.link{color:var(--gold-2);font:400 15px var(--body);text-decoration-color:rgba(255,214,190,.35)}
.link:hover{color:var(--ink)}

/* ปุ่ม */
.btn-go{position:relative;overflow:hidden;height:54px;padding:0 34px;border:0;border-radius:999px;color:#2a0f08;font:500 16.5px var(--display);letter-spacing:0;
  background:linear-gradient(135deg,#ffe6d6 0%,#f6ad85 38%,#e0845c 70%,#b24a2a 100%);
  box-shadow:0 18px 40px -16px rgba(240,150,105,.6),inset 0 1px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(110,30,14,.35);transition:transform .2s var(--ease),box-shadow .25s,filter .25s}
.btn-go::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);transform:translateX(-120%);transition:transform .9s var(--ease)}
.btn-go:hover{background:linear-gradient(135deg,#fff0e4 0%,#f9ba95 38%,#e88d66 70%,#bd5434 100%);transform:translateY(-1px);filter:brightness(1.04);
  box-shadow:0 22px 48px -14px rgba(240,150,105,.75),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(110,30,14,.35)}
.btn-go:hover::after{transform:translateX(120%)}
.btn-go:disabled{background:rgba(255,214,190,.1);color:rgba(255,214,190,.4);box-shadow:inset 0 0 0 1px rgba(255,214,190,.14);filter:none;transform:none}
.btn-go:disabled::after{display:none}
.btn-back{color:var(--text-2);font:400 15px var(--body)}
.btn-back:hover{color:var(--ink);background:rgba(255,214,190,.07)}
.kbd{color:var(--muted)}
.kbd kbd{border-color:var(--line-2);color:var(--text-2);font:500 11.5px var(--latin)}
.btn-ghost{border-color:var(--line-2);color:var(--gold-2);font:400 14.5px var(--body)}
.btn-ghost:hover{background:rgba(240,150,105,.12);border-color:rgba(240,150,105,.6)}

/* แผงด้านใน */
.glass,.choice,.opt .card,.files,.chip-btn{border:1px solid var(--line);border-radius:20px;background:rgba(255,232,220,.035)}
.choice{padding:30px 24px 28px;border-radius:22px;transition:border-color .3s,background .3s,box-shadow .3s,transform .3s var(--ease)}
.choice:hover{border-color:rgba(240,150,105,.55);background:rgba(255,232,220,.06);transform:translateY(-3px);box-shadow:0 26px 50px -28px rgba(0,0,0,.9),0 0 44px -18px rgba(240,150,105,.5)}
.choice .ico{width:60px;height:60px;border:1px solid rgba(240,150,105,.45);color:var(--gold-2);background:radial-gradient(circle at 30% 25%,rgba(255,222,200,.25),rgba(240,150,105,.05));box-shadow:0 0 30px -10px rgba(240,150,105,.55)}
.choice b{font:400 20px/1.4 var(--display);color:var(--ink)}
.choice small{color:var(--text-2)}
.sub{font:400 14.5px var(--body);color:var(--text-2)}
.chip-btn{border-radius:16px}
.chip-btn:hover{border-color:rgba(240,150,105,.6)}
.chip-btn b{font:500 13px var(--latin);letter-spacing:.12em;color:var(--gold-2)}
.chip-btn span{color:var(--text-2)}
.opt .card{min-height:76px;padding:14px 16px;border-radius:16px;transition:border-color .2s,background .2s,box-shadow .25s}
.opt:hover .card{border-color:var(--line-2);background:rgba(255,232,220,.06)}
.opt b{font:400 15.5px/1.35 var(--display);color:var(--ink)}
.opt small{font:400 10.5px/1.7 var(--latin);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.opt input:checked+.card{border-color:rgba(240,150,105,.8);background:linear-gradient(135deg,rgba(240,150,105,.2),rgba(240,150,105,.05));box-shadow:inset 0 0 0 1px rgba(240,150,105,.5),0 14px 34px -18px rgba(240,150,105,.55)}
.opt input:checked+.card::after{color:var(--gold-2)}
.opt input:focus-visible+.card{outline-color:var(--gold)}
.orb{width:9px;height:9px;transform:none;border-radius:50%;border:1px solid rgba(240,150,105,.7);background:transparent}
.opt .orb,.tag .orb,.frow.new .orb,.frow.sent .orb,.progress-chips>span.on .orb,.progress-chips>span.now .orb{opacity:1;border-color:transparent;background:radial-gradient(circle at 35% 30%,#fff0e6,#f0a57a 60%,#b9502f);box-shadow:0 0 10px rgba(240,150,105,.7)}
.frow .orb,.progress-chips>span .orb{opacity:.6}

/* ไฟล์ */
.files{padding:6px 18px}
.frow+.frow{border-top-color:rgba(255,214,190,.08)}
.frow.drag{background:rgba(240,150,105,.08)}
.f-main b{font:400 16px var(--display);color:var(--ink)}
.f-main small,.f-file{color:var(--muted)}
.frow.sent .f-file{color:var(--ok)}
.frow.new .f-file{color:var(--gold-2)}
.pick{border-color:var(--line-2);color:var(--gold-2);font:400 14px var(--body)}
.pick:hover{border-color:rgba(240,150,105,.6);background:rgba(240,150,105,.12)}
.frow.new .pick{border-color:rgba(240,150,105,.5);background:rgba(240,150,105,.14)}
.del{color:var(--muted)}
.del:hover{background:rgba(255,176,192,.12);color:var(--err)}
body.dropping .files{border-color:var(--gold);box-shadow:0 0 0 4px rgba(240,150,105,.15)}

/* ตรวจทาน / สำเร็จ */
.sum{padding:6px 26px}
.sum div+div{border-top-color:rgba(255,214,190,.08)}
.sum dt{font:400 14px var(--body);color:var(--gold)}
.sum dd{color:var(--ink)}
.sum .tags{display:flex;flex-wrap:wrap;gap:8px;padding:0;border:0}
.choice:focus-visible,.opt input:focus-visible+.card{outline:1px solid rgba(240,150,105,.5);outline-offset:4px}
.tag{border-color:rgba(240,150,105,.35);background:rgba(240,150,105,.1);color:var(--ink);font:400 14px var(--body)}
.tag em{font:500 10.5px var(--latin);font-style:normal;letter-spacing:.12em;color:var(--gold-2)}
.check{font:400 15px var(--body);color:var(--text-2)}
.check input{accent-color:#f0a57a}
.seal{width:96px;height:96px;margin:0 auto 28px;color:#2a0f08;
  background:radial-gradient(circle at 32% 28%,#fff0e6 0%,#f6b892 30%,#e0845c 62%,#a8432a 100%);
  box-shadow:0 0 0 8px rgba(240,150,105,.10),0 0 0 9px rgba(240,150,105,.35),0 0 60px rgba(240,150,105,.45),0 20px 40px -12px rgba(0,0,0,.8);
  animation:seal .9s cubic-bezier(.2,1.3,.4,1) .15s both}
.seal::before{inset:-24px;border:1px solid rgba(240,150,105,.35);animation:pulse 2.8s ease-out 1.1s infinite both}
.seal svg{width:44px;height:44px}
.seal path{stroke-dasharray:1;animation:draw .6s .75s ease-out both}
@keyframes seal{from{opacity:0;transform:scale(.4)}}
@keyframes pulse{0%{opacity:.85;transform:scale(.8)}100%{opacity:0;transform:scale(1.35)}}
@keyframes draw{from{stroke-dashoffset:1}}
.codebox{padding:22px}
.codebox small{font:400 13px var(--body);color:var(--muted)}
.codebox b{font:400 clamp(24px,3.6vw,36px) var(--latin);letter-spacing:.16em;background:var(--gold-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.progress-chips>span{border-color:var(--line);color:var(--muted);font:400 13.5px var(--body)}
.progress-chips>span.on{color:var(--ink);border-color:var(--line-2)}
.progress-chips>span.now{color:var(--gold-2);border-color:rgba(240,150,105,.6);background:rgba(240,150,105,.1)}
.glass.signal{border-left:0;border-right:0;border-radius:0;background:transparent}
.signal svg{color:var(--gold-2)}
.signal small{font:500 11px/1 var(--latin);letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;background:var(--gold-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.signal p{font:300 19px/1.5 var(--display);color:var(--ink)}
.redir{color:var(--text-2);font:400 14.5px var(--body)}
.redir .rt{stroke:rgba(255,214,190,.14)}
.redir .rb{stroke:var(--gold)}
.note{border-color:rgba(240,150,105,.3);background:rgba(240,150,105,.08);color:var(--ink)}
.note b{color:var(--gold)}
.pinfo{color:var(--text-2)}

/* กำลังส่ง: วงแหวนความคืบหน้า */
.launch{position:relative;display:grid;place-items:center;width:200px;height:200px;margin:0 auto}
.launch::before{content:"";position:absolute;inset:20px;border-radius:50%;border:1px dashed rgba(240,150,105,.28);animation:spin 16s linear infinite}
.launch svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);animation:none}
.ring circle{fill:none;stroke-width:2}
.ring .rt{stroke:rgba(255,214,190,.1)}

(() => {

  last:  { key: 'lastName', title: 'และ<b>นามสกุล</b>', desc: 'นามสกุลของผู้วิจัยหลัก',
           ph: 'เช่น ใจดี', hint: '', max: 100, err: 'กรุณากรอกนามสกุล', ac: 'family-name' },
  work:  { key: 'workplace', title: 'สังกัด<b>หน่วยงานใด</b>', desc: 'หน่วยงานหรือสถานศึกษาที่สังกัด',

const SIGNALS = [
  'กรรมการสอบจะยิ้มให้ตั้งแต่หน้าแรก',
  'อาจารย์ที่ปรึกษาตอบข้อความภายใน 5 นาที',

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────── helpers ───────── */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const wait = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const extOf = n => ((/\.([^.]+)$/.exec(n || '') || [])[1] || '').toLowerCase();
const fmtSize = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(2) + ' MB';
const clean = s => String(s || '').replace(/\s+/g, ' ').trim();
const normCode = s => String(s || '').toUpperCase().replace(/\s+/g, '');
const thaiNow = () => new Date().toLocaleString('th-TH', { dateStyle: 'long', timeStyle: 'short' }) + ' น.';
const thaiShort = d => d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });
const slotOf = k => SLOTS.find(s => s.key === k);
const orb = c => `<span class="orb" style="--c:${c}"></span>`;
const ICON = {
  rocket: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15c-2-2-3-5-2-9 3-2 6-2 9-1 1 3 1 6-1 9-4 1-6 1-6 1z"/><circle cx="15" cy="9" r="1.6"/><path d="M9 13l-4 1 2-4M11 15l-1 4 4-2M6 18c-1 1-1 2-1 2s1 0 2-1"/></svg>',
  sat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 7l4 4-6 6-4-4z"/><path d="M15 5l4 4M5 15l4 4M3 13l4-4M11 21l4-4M17 13a4 4 0 0 1-4 4"/><path d="M19 15a6 6 0 0 1-6 6"/></svg>',
  chev: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  signal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M12 3l1.8 5.4L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.6z"/><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg>',
  alert: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>',
};

/* ───────── state ───────── */
const blankInfo = () => ({ title: '', design: '', firstName: '', lastName: '', workplace: '' });
const state = {
  step: 'start', hist: [], mode: null, edit: false,
  info: blankInfo(), project: null, files: {},
  code: '', q1: '', q2: '', matches: null,
  session: null, prog: null, txError: '', busy: false, fin: null, stay: false, timer: null,
};

/* ═════════ ละอองทอง + แสงโบเก้ (เร่งเป็นเส้นแสงตอนส่งงาน) ═════════ */
const sky = (() => {
  const c = $('#sky'), ctx = c.getContext && c.getContext('2d');
  if (!ctx) return { set() {}, burst() {} };
  const R = Math.random;
  let W = 1, H = 1, dust = [], bokeh = [], sparks = [], speed = 1, target = 1, raf = 0;
  const sprite = document.createElement('canvas'); sprite.width = sprite.height = 64;
  { const g = sprite.getContext('2d'), rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    rg.addColorStop(0, 'rgba(255,236,224,1)'); rg.addColorStop(.22, 'rgba(246,170,130,.65)'); rg.addColorStop(1, 'rgba(240,150,105,0)');
    g.fillStyle = rg; g.fillRect(0, 0, 64, 64); }
  const mkDust = (p, any) => Object.assign(p, { x: R() * W, y: any ? R() * H : H + 10, r: .5 + R() * 1.5, vy: .1 + R() * .32, ph: R() * 6.28, tw: .5 + R() * 1.5, a: .3 + R() * .5 });
  const mkBokeh = (b, any) => Object.assign(b, { x: R() * W, y: any ? R() * H : H + 120, r: 30 + R() * 90, vy: .03 + R() * .1, vx: (R() - .5) * .08, ph: R() * 6.28, a: .035 + R() * .07 });
  const resize = () => {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dust = Array.from({ length: Math.min(70, Math.round(W * H / 18000)) }, () => mkDust({}, true));
    bokeh = Array.from({ length: Math.min(12, Math.round(W * H / 90000)) }, () => mkBokeh({}, true));
  };
  const frame = t => {
    speed += (target - speed) * 0.05;
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (const b of bokeh) {
      b.y -= b.vy * speed; b.x += b.vx + Math.sin(t / 5000 + b.ph) * .15;
      if (b.y < -b.r) mkBokeh(b, false);
      ctx.globalAlpha = b.a * (.7 + .3 * Math.sin(t / 2600 + b.ph));
      ctx.drawImage(sprite, b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }
    ctx.fillStyle = '#ffd2b3';
    for (const p of dust) {
      p.y -= p.vy * speed; p.x += Math.sin(t / 2200 + p.ph) * .25;
      if (p.y < -70) mkDust(p, false);
      if (speed > 2.4) {                          // ตอนส่งงาน: ละอองยืดเป็นเส้นแสง
        ctx.globalAlpha = p.a * .75;
        ctx.fillRect(p.x - p.r * .5, p.y, p.r, Math.min(70, p.vy * speed * 7));
      } else {
        const s = p.r * 4;
        ctx.globalAlpha = p.a * (.55 + .45 * Math.sin(t / 700 * p.tw + p.ph));
        ctx.drawImage(sprite, p.x - s, p.y - s, s * 2, s * 2);
      }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      if (--p.life <= 0) { sparks.splice(i, 1); continue; }
      p.vx *= .955; p.vy = p.vy * .955 + .028; p.x += p.vx; p.y += p.vy;
      const k = p.life / p.max, s = p.r * (2 + 3 * k);
      ctx.globalAlpha = Math.min(1, k * 1.6);
      ctx.drawImage(sprite, p.x - s, p.y - s, s * 2, s * 2);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    if (!REDUCED) raf = requestAnimationFrame(frame);
  };
  resize();
  if (REDUCED) frame(0); else raf = requestAnimationFrame(frame);
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { resize(); if (REDUCED) frame(0); }, 200); });
  document.addEventListener('visibilitychange', () => { cancelAnimationFrame(raf); if (!document.hidden && !REDUCED) raf = requestAnimationFrame(frame); });
  return {
    set(mode, level = 0) { target = mode === 'warp' ? 16 : mode === 'travel' ? 1.6 + level * 2.6 : 1; },
    burst(x, y, n = 16, power = 1) {
      if (REDUCED) return;
      for (let i = 0; i < n; i++) {
        const ang = R() * 6.283, sp = (1 + R() * 3.4) * power, life = 36 + (R() * 40 | 0);
        sparks.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - .8, r: .7 + R() * 1.5, life, max: life });
      }
      if (sparks.length > 400) sparks.splice(0, sparks.length - 400);
    },
  };
})();

/* ═════════ ลูกเล่น: แสงตามเมาส์บนขอบการ์ด · ประกายเมื่อคลิก · intro ═════════ */
const fx = (() => {
  const q = $('#q');
  if (!REDUCED && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    let mx = 0, my = 0, pend = 0;
    const apply = () => {
      pend = 0;
      const r = q.getBoundingClientRect();
      q.style.setProperty('--gx', ((mx - r.left) / r.width * 100).toFixed(1) + '%');
      q.style.setProperty('--gy', ((my - r.top) / r.height * 100).toFixed(1) + '%');
    };
    window.addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; if (!pend) pend = requestAnimationFrame(apply); }, { passive: true });
  } else if (!REDUCED) q.classList.add('drift');

  document.addEventListener('click', e => {
    if (e.target.tagName === 'INPUT') return;
    const t = e.target.closest('.btn-go:not(:disabled), .choice, .opt, .chip-btn');
    if (!t) return;
    let x = e.clientX, y = e.clientY;
    if (!x && !y) { const r = t.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }
    sky.burst(x, y, t.classList.contains('btn-go') ? 24 : 14);
  });

  const sp = $('#splash');
  if (sp) {
    if (REDUCED || /[?&]intro=0\b/.test(location.search)) sp.remove();
    else {
      document.body.classList.add('splash-on');
      const end = () => {
        if (sp.classList.contains('out')) return;
        sp.classList.add('out');
        document.body.classList.remove('splash-on'); document.body.classList.add('reveal');
        setTimeout(() => { sp.remove(); q.classList.remove('enter', 'back'); document.body.classList.remove('reveal'); }, 1200);
      };
      sp.addEventListener('click', end);
      window.addEventListener('keydown', end, { once: true });
      setTimeout(end, 1900);
    }
  }

  let celebrated = '';
  return {
    step(s) {
      if (s !== 'done' || !state.fin || celebrated === state.fin.submissionId) return;
      celebrated = state.fin.submissionId;
      setTimeout(() => {
        const el = $('.seal'); if (!el) return;
        const r = el.getBoundingClientRect();
        sky.burst(r.left + r.width / 2, r.top + r.height / 2, 70, 1.8);
      }, 600);
    },
  };
})();

function inputHtml(o) {

  return o.multi ? `<textarea ${attrs} rows="1">${esc(o.value)}</textarea>` : `<input ${attrs} type="text" value="${esc(o.value)}">`;
}
function showErr(msg, target) {
  const slot = $('#err'); if (slot) slot.innerHTML = ICON.alert + `<span>${esc(msg)}</span>`;
  const t = target || $('#stepBody .in') || $('#stepBody');
  if (t.classList.contains('in')) t.classList.add('bad');
  t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake');
  const i = $('#stepBody .in'); if (i) i.focus();
}
function clearErr() { const s = $('#err'); if (s) s.innerHTML = ''; $$('#stepBody .in.bad').forEach(i => i.classList.remove('bad')); }

/* ───────── เส้นทางโคจร ───────── */
function needDesign() { return state.mode === 'continue' && state.project && !state.edit && !clean(state.info.design); }
function flowPath() {
  if (state.mode === 'continue') return ['start', 'code', 'project', ...(state.edit ? ['title', 'design', 'first', 'last', 'work'] : needDesign() ? ['design'] : []), 'files', 'review'];
  return ['start', 'title', 'design', 'first', 'last', 'work', 'files', 'review'];
}
function stepIndex() { const p = flowPath(); return { i: p.indexOf(state.step === 'byname' ? 'code' : state.step), n: p.length - 1 }; }
function setTraj(frac) {
  const p = flowPath(), n = p.length;
  const dots = $('#trajDots');
  if (dots.childElementCount !== n + 1) dots.innerHTML = Array.from({ length: n + 1 }, (_, k) => `<span style="left:${(k / n * 100).toFixed(2)}%"></span>`).join('');
  $$('span', dots).forEach((d, k) => d.classList.toggle('on', k / n <= frac + 1e-6));
  const v = Math.max(0, Math.min(1, frac));
  $('#trajFill').style.width = (v * 100).toFixed(1) + '%';
  $('#rocket').style.left = (v * 100).toFixed(1) + '%';
}
function loading(on) {
  document.body.classList.toggle('busy', on);
  $('#btnNext').disabled = on;
  const l = $('#nextLabel');
  if (on) { l.dataset.l = l.textContent; l.textContent = 'กำลังค้นหา…'; }
  else if (l.dataset.l) { l.textContent = l.dataset.l; delete l.dataset.l; }
}

          <div class="glass signal">${ICON.signal}<span><small>Blessings</small><p id="signal">${esc(signal())}</p></span><button type="button" class="btn-ghost" id="reSignal">ขอคำอวยพรใหม่</button></div>

            : `<div class="redir"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="rt" cx="20" cy="20" r="15.9"/><circle class="rb" id="redirRing" cx="20" cy="20" r="15.9" pathLength="100"/></svg>
                <span id="redirText">กำลังนำท่านสู่ Dashboard ใน ${CONFIG.REDIRECT_SEC} วินาที…</span></div>`}`,

let lastSignal = -1;
function signal() {
  let i; do { i = (Math.random() * SIGNALS.length) | 0; } while (i === lastSignal && SIGNALS.length > 1);
  lastSignal = i; return SIGNALS[i];
}

function qStep(id, nextOf) {
  const q = Q[id];
  return {
    view: () => ({
      title: q.title, desc: q.desc,
      body: inputHtml({ id: 'inp', value: state.info[q.key], max: q.max, multi: q.multi, ph: q.ph, ac: q.ac, aria: q.desc })
        + `<div class="hint"><span>${esc(q.hint)}</span>${q.multi ? '<span id="cnt"></span>' : ''}</div><div class="err" id="err"></div>`,
      next: { label: 'ถัดไป' },
      after() {
        const el = $('#inp');
        const sync = () => {
          state.info[q.key] = el.value;
          if (q.multi) { autoGrow(el); $('#cnt').textContent = `${el.value.length}/${q.max}`; }
          clearErr(); saveDraft();
        };
        el.addEventListener('input', sync);
        if (q.multi) {
          el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); onNext(); } });
          requestAnimationFrame(() => { autoGrow(el); $('#cnt').textContent = `${el.value.length}/${q.max}`; });
        }
      },
    }),
    next() {
      const v = clean($('#inp').value);
      state.info[q.key] = v; $('#inp').value = v;
      if (!v) return showErr(q.err);
      saveDraft();
      go(nextOf());
    },
  };
}

function recentHtml() {

function matchesHtml() {

}

/* ═════════ RENDER / NAV ═════════ */
function go(step, back) {
  if (!back && state.step !== step && state.step !== 'sending') state.hist.push(state.step);
  state.step = step;
  render(back ? 'back' : 'fwd');
}
function goBack() {
  if (state.busy) return;
  const prev = state.hist.pop();
  if (prev) { state.step = prev; render('back'); }
}

function render(dir = 'fwd') {
  const v = STEPS[state.step].view();
  const { i, n } = stepIndex();
  $('#label').textContent = v.label || (i > 0 ? `ขั้นที่ ${i} จาก ${n}` : 'ยินดีต้อนรับ');
  $('#qTitle').innerHTML = v.title;                       // ข้อความคงที่จากโค้ด (ไม่มีข้อมูลผู้ใช้)
  const d = $('#qDesc'); d.textContent = v.desc || ''; d.hidden = !v.desc;
  $('#stepBody').innerHTML = v.body;
  const qEl = $('#q'); qEl.classList.remove('enter', 'back'); void qEl.offsetWidth; qEl.classList.add('enter'); if (dir === 'back') qEl.classList.add('back');

  const nb = $('#btnNext');
  nb.hidden = !v.next;
  $('#kbd').hidden = !v.next || ['files', 'review', 'done', 'sending', 'design', 'project'].includes(state.step);
  if (v.next) { $('#nextLabel').textContent = v.next.label; delete $('#nextLabel').dataset.l; nb.disabled = !!v.next.disabled; }
  const bb = $('#btnBack');
  const back = v.back === false ? null : v.back || (state.hist.length ? { label: '← ย้อนกลับ', action: goBack } : null);
  bb.hidden = !back;
  if (back) { bb.textContent = back.label; bb.onclick = back.action; }
  $('#acts').hidden = !v.next && !back;

  if (state.step === 'done') setTraj(1); else if (state.step !== 'sending') setTraj(i <= 0 ? 0 : i / (n + 1));
  if (state.step !== 'sending') sky.set('idle');
  $('#stepCount').textContent = i > 0 ? `ขั้นที่ ${i} จาก ${n}` : state.step === 'done' ? 'ส่งงานเรียบร้อย' : 'ระบบส่งงานข้อมูลวิจัย';

  if (v.after) v.after();
  fx.step(state.step);
  const target = (v.focus && $(v.focus)) || $('#stepBody .in, #stepBody button, #stepBody input');
  if (target) setTimeout(() => target.focus({ preventScroll: true }), 40);
  window.scrollTo({ top: 0, behavior: 'auto' });
}

async function onNext() {
  if (state.busy || $('#btnNext').disabled || $('#btnNext').hidden) return;
  const s = STEPS[state.step];
  if (s.next) await s.next();
}
$('#btnNext').addEventListener('click', onNext);
$('#stepForm').addEventListener('submit', e => { e.preventDefault(); onNext(); });

/* ═════════ PROJECT LOOKUP ═════════ */
async function lookupCode(raw) {
  const code = normCode(raw);
  if (!CODE_RE.test(code)) { snack('รูปแบบรหัสโครงการไม่ถูกต้อง'); return; }
  state.code = code;
  loading(true);
  try {
    const r = await api({ action: 'lookup', code });
    loadProject(r.project);
    loading(false);
    go('project');
  } catch (e) {
    loading(false);
    if (state.step === 'code' && $('#err')) showErr(e.message);
    else snack(e.message, 6500);
  }
}
function loadProject(p) {
  state.project = p;
  state.info = { title: p.title || '', design: p.design || '', firstName: p.firstName || '', lastName: p.lastName || '', workplace: p.workplace || '' };
  state.session = null;
  saveRecent(p.code, p.title);
}

/* ═════════ FILES ═════════ */
const ACCEPT_ATTR = CONFIG.ACCEPT_EXT.map(e => '.' + e).join(',');
const remoteOf = k => (state.project && state.project.files && state.project.files[k]) || null;

function renderFiles() {
  const ul = $('#fileList'); if (!ul) return;
  ul.innerHTML = SLOTS.map(s => {
    const f = state.files[s.key], r = remoteOf(s.key);
    const cls = f ? 'new' : r ? 'sent' : '';
    const line = f ? `${esc(f.name)} · ${fmtSize(f.size)}${r ? ` · แทนฉบับที่ ${r.v}` : ''}` : r ? `✓ ส่งแล้ว ฉบับที่ ${r.v}${r.at ? ' · ' + esc(r.at) : ''}` : 'ยังไม่ได้เลือกไฟล์';
    const btn = f ? 'เปลี่ยน' : r ? 'แนบฉบับแก้ไข' : 'เลือกไฟล์';
    return `<li class="frow ${cls}" data-slot="${s.key}">${orb(s.c)}
      <span class="f-main"><b>${s.label}</b><small>${s.desc}</small><span class="f-file" title="${f ? esc(f.name) : ''}">${line}</span></span>
      <span class="f-act"><button type="button" class="pick" data-pick>${btn}</button>${f ? `<button type="button" class="del" data-del aria-label="นำไฟล์ ${s.label} ออก" title="นำออก">${ICON.x}</button>` : ''}</span>
      <input type="file" accept="${ACCEPT_ATTR}" hidden aria-hidden="true" tabindex="-1"></li>`;
  }).join('');
  $$('.frow', ul).forEach(row => {
    const key = row.dataset.slot, input = $('input', row);
    $('[data-pick]', row).addEventListener('click', () => input.click());
    input.addEventListener('change', () => { if (input.files[0]) setFile(key, input.files[0]); });
    const del = $('[data-del]', row);
    if (del) del.addEventListener('click', () => { delete state.files[key]; if (state.session) delete state.session.uploaded[key]; renderFiles(); });
    row.addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); e.stopPropagation(); row.classList.add('drag'); });
    row.addEventListener('dragleave', e => { if (!row.contains(e.relatedTarget)) row.classList.remove('drag'); });
    row.addEventListener('drop', e => {
      if (!hasFiles(e)) return;
      e.preventDefault(); e.stopPropagation(); endDrag();
      const list = Array.from(e.dataTransfer.files);
      if (list.length === 1) setFile(key, list[0]); else autoAssign(list);
    });
  });
  const n = Object.keys(state.files).length;
  const fc = $('#fcount'); if (fc) fc.textContent = n ? `เลือกแล้ว ${n} ไฟล์` : '';
}

function validateFile(f) {
  if (!CONFIG.ACCEPT_EXT.includes(extOf(f.name))) return 'รองรับเฉพาะไฟล์ ' + CONFIG.ACCEPT_EXT.join(', ').toUpperCase();
  if (!f.size) return 'ไฟล์ว่างเปล่า';
  if (f.size > CONFIG.MAX_FILE_MB * 1048576) return `ไฟล์ใหญ่เกิน ${CONFIG.MAX_FILE_MB} MB (${fmtSize(f.size)})`;
  return '';
}
function setFile(key, file, quiet) {
  const err = validateFile(file);
  if (err) { snack(`${slotOf(key).label}: ${err}`, 5500); return false; }
  state.files[key] = file;
  if (state.session) delete state.session.uploaded[key];
  clearErr();
  if (!quiet) renderFiles();
  return true;
}

function guessSlot(name) {
  const n = name.normalize('NFC').toLowerCase().replace(/\.[^.]+$/, '')
    .replace(/[๐-๙]/g, d => String('๐๑๒๓๔๕๖๗๘๙'.indexOf(d)));
  const m = /(?:บทที่|บท)[\s._-]*0?([1-5])(?!\d)/.exec(n)
         || /(?:^|[^a-z])(?:chapter|chap|ch)[\s._-]*0?([1-5])(?!\d)/.exec(n);
  if (m) return 'ch' + m[1];
  if (/(อ้างอิง|บรรณานุกรม|reference|bibliograph|\brefs?\b)/.test(n)) return 'ref';
  if (/(ชื่อเรื่อง|หน้าปก|ปก|cover|title)/.test(n)) return 'title';
  return null;
}
function autoAssign(list) {
  const used = new Set(), unknown = []; let placed = 0;
  list.forEach(f => {
    const key = guessSlot(f.name);
    if (key && !used.has(key)) { used.add(key); if (setFile(key, f, true)) placed++; }
    else unknown.push(f.name);
  });
  renderFiles();
  if (unknown.length) snack(`ระบุช่องไม่ได้: ${unknown.join(', ')} — กดเลือกไฟล์ในช่องที่ต้องการแทน`, 7000);
  else if (placed) snack(`จัดไฟล์เข้าช่องอัตโนมัติแล้ว ${placed} ไฟล์`);
}

let dragDepth = 0;
const hasFiles = e => !!e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
function endDrag() { dragDepth = 0; document.body.classList.remove('dropping'); $$('.frow.drag').forEach(r => r.classList.remove('drag')); }
document.addEventListener('dragenter', e => { if (!hasFiles(e)) return; dragDepth++; if (state.step === 'files') document.body.classList.add('dropping'); });
document.addEventListener('dragleave', e => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) endDrag(); });
document.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
document.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); endDrag();
  if (state.step !== 'files') { snack('แนบไฟล์ได้ในขั้นตอน “แนบบทที่พร้อมส่ง”'); return; }
  const list = Array.from(e.dataTransfer.files);
  if (list.length) autoAssign(list);
});

/* ═════════ API ═════════ */
async function api(payload) {
  if (DEMO) return demoApi(payload);
  let res;
  try {
    res = await fetch(CONFIG.GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // simple request — ไม่เกิด CORS preflight
      body: JSON.stringify(payload),
      redirect: 'follow',
    });
  } catch (e) {
    throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจสอบอินเทอร์เน็ต หรือการ Deploy Web App (Who has access ต้องเป็น "Anyone")');
  }
  if (!res.ok) throw new Error(`เซิร์ฟเวอร์ตอบกลับผิดพลาด (HTTP ${res.status})`);
  let data;
  try { data = await res.json(); }
  catch (e) { throw new Error('ข้อมูลตอบกลับไม่ถูกต้อง — ตรวจสอบว่าใช้ Web App URL ที่ลงท้ายด้วย /exec'); }
  if (!data || !data.ok) {
    const msg = (data && data.error) || 'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ';
    throw new Error(/ไม่รู้จักคำสั่ง/.test(msg) ? msg + ' — เซิร์ฟเวอร์ยังเป็นโค้ดเวอร์ชันเก่า กรุณาอัปเดต Code.gs แล้ว Deploy เวอร์ชันใหม่' : msg);
  }
  return data;
}

/* โหมดทดลอง: จำลองเซิร์ฟเวอร์ในหน่วยความจำ (หายเมื่อรีเฟรช) */
const demoDB = {};
function makeDemoId() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let r = ''; for (let i = 0; i < 4; i++) r += A[(Math.random() * A.length) | 0];
  return `RS-${String(d.getFullYear()).slice(2)}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}-${r}`;
}
async function demoApi(p) {
  const kb = p.data ? p.data.length * 0.75 / 1024 : 0;
  await wait(p.action === 'upload' ? Math.min(3500, 600 + kb * 0.9) : 600 + Math.random() * 300);
  if (p.action === 'lookup') {
    if (p.code) {
      const x = demoDB[p.code];
      if (!x) throw new Error(`ไม่พบรหัสโครงการ ${p.code} (โหมดทดลองจำเฉพาะโครงการที่ส่งในหน้านี้)`);
      return { ok: true, project: JSON.parse(JSON.stringify(x)) };
    }
    const m = Object.values(demoDB).filter(x => x.lastName === p.lastName && x.firstName.includes(p.firstName));
    if (!m.length) throw new Error('ไม่พบโครงการที่ตรงกับชื่อ–สกุลนี้');
    return { ok: true, matches: m.map(x => ({ code: x.code, title: x.title, done: Object.keys(x.files).length, total: SLOTS.length, updatedAt: x.updatedAt })) };
  }
  const batch = 'B' + Date.now().toString(36);
  if (p.action === 'begin') {
    if (p.projectId) {
      if (!demoDB[p.projectId]) throw new Error('ไม่พบรหัสโครงการ ' + p.projectId);
      return { ok: true, submissionId: p.projectId, folderId: 'demo', batch, isNew: false };
    }
    return { ok: true, submissionId: makeDemoId(), folderId: 'demo', batch, isNew: true };
  }
  if (p.action === 'upload') return { ok: true, fileId: 'demo-' + p.slot + '-' + Date.now() };
  const isNew = !demoDB[p.submissionId];
  const x = demoDB[p.submissionId] || (demoDB[p.submissionId] = { code: p.submissionId, files: {}, rounds: 0, review: 'รอตรวจ', note: '' });
  Object.assign(x, { title: p.title, design: p.design, firstName: p.firstName, lastName: p.lastName, workplace: p.workplace });
  const at = thaiShort(new Date()), sentNow = [];
  SLOTS.forEach(s => {
    if (!p.files[s.key]) return;
    const v = x.files[s.key] ? x.files[s.key].v + 1 : 1;
    x.files[s.key] = { name: p.names[s.key], original: p.names[s.key], v, at };
    sentNow.push(s.label + (v > 1 ? ` (ฉบับที่ ${v})` : ''));
  });
  x.rounds++; x.updatedAt = at;
  const missing = SLOTS.filter(s => !x.files[s.key]).map(s => s.label);
  return { ok: true, submissionId: x.code, isNew, round: x.rounds, timestamp: thaiNow(), sentNow,
    done: SLOTS.length - missing.length, total: SLOTS.length, complete: !missing.length, missing, demo: true };
}

const readBase64 = file => new Promise((resolve, reject) => {
  const fr = new FileReader();
  fr.onload = () => resolve(String(fr.result).split(',')[1] || '');
  fr.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ: ' + file.name));
  fr.readAsDataURL(file);
});

/* ═════════ TRANSMIT ═════════ */
function progText(g) { return g.st === 'active' ? Math.floor(g.p * 100) + '%' : g.st === 'done' ? 'สำเร็จ' : g.st === 'error' ? 'ไม่สำเร็จ' : 'รอคิว'; }
function setProg(key, st, p) {
  state.prog[key] = { st, p };
  const li = $(`#plist li[data-k="${key}"]`);
  if (!li) return;
  li.className = st;
  $('.bar i', li).style.width = (p * 100).toFixed(1) + '%';
  $('.pl-st', li).textContent = progText(state.prog[key]);
}
function setNote(t) { const n = $('#plNote'); if (n) n.textContent = t; }
function setPct(f) {
  const v = Math.max(0, Math.min(1, f));
  setTraj(v);
  sky.set('travel', v);
  const b = $('#pct'); if (b) b.textContent = Math.floor(v * 100) + '%';
  const rb = $('#ringBar'); if (rb) rb.style.strokeDashoffset = (100 - v * 100).toFixed(2);
}

/* fetch ไม่รายงานความคืบหน้าการอัปโหลด → แสดงค่าประมาณ แล้วเติมเต็มเมื่อเซิร์ฟเวอร์ตอบกลับ */
function simulate(size, onP) {
  const tau = Math.min(25, Math.max(0.9, size / (450 * 1024)));
  const t0 = performance.now(); let raf = 0, stopped = false;
  const step = t => { if (stopped) return; onP(0.93 * (1 - Math.exp(-Math.max(0, (t - t0) / 1000) / tau))); raf = requestAnimationFrame(step); };
  raf = requestAnimationFrame(step);
  return { stop() { stopped = true; cancelAnimationFrame(raf); } };
}

async function transmit() {
  if (state.busy) return;
  state.busy = true;
  state.txError = '';
  const info = {};
  Object.keys(state.info).forEach(k => { info[k] = clean(state.info[k]); });
  const queue = SLOTS.filter(s => state.files[s.key]);
  const totalBytes = queue.reduce((a, s) => a + state.files[s.key].size, 0) || 1;
  if (!state.prog) state.prog = {};
  queue.forEach(s => { if (!state.prog[s.key] || state.prog[s.key].st !== 'done') state.prog[s.key] = { st: 'wait', p: 0 }; });
  render('fwd');
  const overall = (b, fin) => setPct(0.04 + 0.9 * Math.min(1, b / totalBytes) + (fin ? 0.06 : 0));
  let doneBytes = 0, current = null;
  overall(0);
  try {
    if (!state.session) {
      setNote(state.project ? `กำลังเปิดโครงการ ${state.project.code}…` : 'กำลังสร้างโครงการใหม่…');
      const r = await api({ action: 'begin', ...info, projectId: state.project ? state.project.code : '' });
      state.session = { submissionId: r.submissionId, folderId: r.folderId, batch: r.batch, uploaded: {} };
    }
    const S = state.session;
    queue.forEach(s => { if (S.uploaded[s.key]) { doneBytes += state.files[s.key].size; setProg(s.key, 'done', 1); } });
    overall(doneBytes);
    for (const s of queue) {
      if (S.uploaded[s.key]) continue;
      current = s.key;
      const f = state.files[s.key];
      setNote(`กำลังส่ง${s.label}…`);
      setProg(s.key, 'active', 0);
      const sim = simulate(f.size, p => { setProg(s.key, 'active', p); overall(doneBytes + f.size * p); });
      let r;
      try {
        const data = await readBase64(f);
        r = await api({ action: 'upload', ...info, submissionId: S.submissionId, folderId: S.folderId, batch: S.batch,
          slot: s.key, fileName: f.name, mimeType: f.type || '', data });
      } finally { sim.stop(); }
      S.uploaded[s.key] = r.fileId;
      doneBytes += f.size;
      setProg(s.key, 'done', 1);
      overall(doneBytes);
    }
    current = null;
    setNote('กำลังบันทึกลงทะเบียน…');
    const files = {}, names = {};
    queue.forEach(s => { files[s.key] = S.uploaded[s.key]; names[s.key] = state.files[s.key].name; });
    const fin = await api({ action: 'finish', ...info, submissionId: S.submissionId, folderId: S.folderId, batch: S.batch, files, names });
    overall(totalBytes, true);
    fin.queue = queue.map(s => ({ slot: s, name: state.files[s.key].name, size: state.files[s.key].size }));
    fin.info = info;
    fin.prevRemote = state.project ? { ...state.project.files } : {};
    state.fin = fin;
    saveRecent(fin.submissionId, info.title);
    clearDraft();
    state.files = {}; state.session = null; state.prog = null; state.hist = []; state.stay = false;
    state.busy = false;
    await wait(REDUCED ? 0 : 350);
    go('done');
    startCountdown();
  } catch (err) {
    if (current) setProg(current, 'error', 0);
    state.txError = (err && err.message) || String(err);
    state.busy = false;
    sky.set('idle');
    render('fwd');
  } finally {
    state.busy = false;
  }
}

/* ═════════ DONE → ลอยขึ้นสู่ DASHBOARD ═════════ */
function toDashboard() {
  clearInterval(state.timer);
  const code = state.fin && state.fin.submissionId;
  const url = CONFIG.DASHBOARD_URL + (code ? '?code=' + encodeURIComponent(code) : '');
  if (REDUCED) { location.href = url; return; }
  sky.set('warp');
  document.body.classList.add('warping');
  setTimeout(() => { location.href = url; }, 900);
}
function startCountdown() {
  clearInterval(state.timer);
  let left = CONFIG.REDIRECT_SEC;
  const ring = $('#redirRing');
  if (ring) {
    ring.style.transition = 'none'; ring.style.strokeDashoffset = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => { ring.style.transition = `stroke-dashoffset ${CONFIG.REDIRECT_SEC}s linear`; ring.style.strokeDashoffset = '100'; }));
  }
  state.timer = setInterval(() => {
    left--;
    const t = $('#redirText');
    if (t) t.textContent = left > 0 ? `กำลังนำท่านสู่ Dashboard ใน ${left} วินาที…` : 'กำลังเปิด Dashboard…';
    if (left <= 0) { clearInterval(state.timer); toDashboard(); }
  }, 1000);
}
function stayHere() { clearInterval(state.timer); state.stay = true; render('fwd'); }
async function copyCode() {
  const id = state.fin.submissionId;
  try { await navigator.clipboard.writeText(id); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = id; document.body.append(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) { /* ignore */ }
    ta.remove();
  }
  snack('คัดลอกรหัสโครงการแล้ว · ' + id);
}
function saveReceipt() {
  const F = state.fin, I = F.info;
  const line = '═'.repeat(48), thin = '─'.repeat(48);
  const txt = [
    'ใบรับการส่งงานข้อมูลวิจัย', line,
    'รหัสโครงการ    : ' + F.submissionId,
    'การส่งครั้งที่   : ' + F.round,
    'วันเวลา        : ' + (F.timestamp || thaiNow()),
    'ชื่อเรื่อง       : ' + I.title,
    'รูปแบบงานวิจัย : ' + I.design,
    'ผู้วิจัย         : ' + I.firstName + ' ' + I.lastName,
    'สถานที่ทำงาน  : ' + I.workplace,
    thin, 'เอกสารที่ส่งครั้งนี้ (' + F.queue.length + ' ไฟล์)',
    ...F.queue.map(q => `  [✓] ${q.slot.label} — ${q.name} (${fmtSize(q.size)})`),
    thin, 'ความคืบหน้าโครงการ : ' + F.done + '/' + F.total + ' ส่วน' + (F.complete ? ' (ครบถ้วน)' : ' · ยังขาด ' + (F.missing || []).join(', ')),
    line, F.demo ? '* โหมดทดลอง — ไม่ได้ส่งข้อมูลจริง' : '* ใช้รหัสโครงการนี้เพื่อส่งบทถัดไป หรือส่งฉบับแก้ไข', '',
  ].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + txt], { type: 'text/plain;charset=utf-8' }));
  a.download = `ใบรับ_${F.submissionId}_ครั้งที่${F.round}.txt`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function resetAll() {
  clearInterval(state.timer);
  Object.assign(state, { step: 'start', hist: [], mode: null, edit: false, info: blankInfo(), project: null, files: {}, code: '', matches: null, session: null, prog: null, txError: '', fin: null, stay: false });
}

/* ═════════ STORAGE ═════════ */
function getRecent() {
  try {
    const a = JSON.parse(localStorage.getItem(CONFIG.RECENT_KEY) || '[]');
    return Array.isArray(a) ? a.filter(x => x && CODE_RE.test(x.code)).slice(0, 4) : [];
  } catch (e) { return []; }
}
function saveRecent(code, title) {
  try {
    const a = getRecent().filter(x => x.code !== code);
    a.unshift({ code, title: String(title || '').slice(0, 140) });
    localStorage.setItem(CONFIG.RECENT_KEY, JSON.stringify(a.slice(0, 6)));
  } catch (e) { /* ignore */ }
}
function saveDraft() {
  if (state.mode !== 'new' || state.project) return;
  try { localStorage.setItem(CONFIG.DRAFT_KEY, JSON.stringify(state.info)); } catch (e) { /* ignore */ }
}
function clearDraft() { try { localStorage.removeItem(CONFIG.DRAFT_KEY); } catch (e) { /* ignore */ } }
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(CONFIG.DRAFT_KEY) || 'null');
    if (!d) return;
    let any = false;
    Object.keys(state.info).forEach(k => { if (typeof d[k] === 'string' && d[k] && !state.info[k]) { state.info[k] = d[k]; any = true; } });
    if (any) snack('กู้คืนข้อมูลที่กรอกค้างไว้แล้ว');
  } catch (e) { /* ignore */ }
}
window.addEventListener('beforeunload', e => {
  if (state.busy || Object.keys(state.files).length) { e.preventDefault(); e.returnValue = ''; }
});

/* ═════════ STATUS ═════════ */
function setStatus(s, text) { $('#status').dataset.s = s; $('#statusText').textContent = text; }
async function ping() {
  if (DEMO) { setStatus('warn', 'โหมดทดลอง'); return; }
  try {
    const url = CONFIG.GAS_URL + (CONFIG.GAS_URL.includes('?') ? '&' : '?') + 'action=ping';
    const d = await (await fetch(url)).json();
    if (d.ok && d.ready && (d.api || 1) < CONFIG.API_VERSION) {
      setStatus('warn', 'ต้องอัปเดต Code.gs');
      snack('เซิร์ฟเวอร์ยังเป็น Code.gs เวอร์ชันเก่า — วางโค้ดใหม่ รัน setup() แล้ว Deploy เวอร์ชันใหม่', 9000);
    } else if (d.ok && d.ready) setStatus('ok', 'เชื่อมต่อแล้ว');
    else if (d.ok) setStatus('warn', 'ผู้ดูแลต้องรัน setup()');
    else setStatus('err', 'เซิร์ฟเวอร์ผิดพลาด');
  } catch (e) { setStatus('err', 'เชื่อมต่อไม่ได้'); }
}

/* ═════════ INIT ═════════ */
render('fwd');
ping();
/* ลิงก์ตรง: index.html?code=RS-…  → เปิดโครงการเดิมทันที */
const qp = normCode(new URLSearchParams(location.search).get('code'));
if (CODE_RE.test(qp)) { state.mode = 'continue'; state.hist = ['start']; state.step = 'code'; state.code = qp; render('fwd'); lookupCode(qp); }
})();
</script>
